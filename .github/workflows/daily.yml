name: Daily Shopify Name 1

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview rewritten Name 1 titles without writing to plentyONE"
        required: true
        default: true
        type: boolean
      max_items:
        description: "Maximum articles to handle (0 = all)"
        required: true
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: shopify-name1-daily
  cancel-in-progress: false

jobs:
  update-name1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLENTY_BASE_URL: ${{ secrets.PLENTY_BASE_URL }}
      PLENTY_USERNAME: ${{ secrets.PLENTY_USERNAME }}
      PLENTY_PASSWORD: ${{ secrets.PLENTY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run automation
        id: automation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items }}
        run: |
          set +e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MAX_ITEMS="${INPUT_MAX_ITEMS:-20}"
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              python -m src.ebay_title_automation --dry-run --max-items "$MAX_ITEMS"
            else
              python -m src.ebay_title_automation --max-items "$MAX_ITEMS"
            fi
          else
            python -m src.ebay_title_automation
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit checkpoint
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        shell: bash
        run: |
          if git diff --quiet -- state/last_processed.json; then
            echo "No checkpoint change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_processed.json
          git commit -m "chore: advance plenty article checkpoint"
          git push

      - name: Fail if automation failed
        if: steps.automation.outputs.exit_code != '0'
        run: exit "${{ steps.automation.outputs.exit_code }}"
