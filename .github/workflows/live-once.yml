name: One-time Plenty live verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-once.yml"

permissions:
  contents: write

concurrency:
  group: ebay-name2-live-verification
  cancel-in-progress: false

jobs:
  live-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLENTY_BASE_URL: ${{ secrets.PLENTY_BASE_URL }}
      PLENTY_USERNAME: ${{ secrets.PLENTY_USERNAME }}
      PLENTY_PASSWORD: ${{ secrets.PLENTY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Update exactly one article
        run: python -m src.ebay_title_automation --max-items 1

      - name: Verify persisted Name 2
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.ebay_title_automation import PlentyClient, build_ebay_title

          state = json.loads(Path("state/last_processed.json").read_text(encoding="utf-8"))
          item_id = int(state["last_article_id"])
          if item_id <= 0:
              raise SystemExit("Checkpoint was not advanced")

          client = PlentyClient(
              os.environ["PLENTY_BASE_URL"],
              os.environ["PLENTY_USERNAME"],
              os.environ["PLENTY_PASSWORD"],
          )
          client.login()
          stock = next((row for row in client.list_positive_stock() if row.item_id == item_id), None)
          if stock is None:
              raise SystemExit(f"ArtikelID {item_id} is no longer in positive NORD WEST stock")

          text = client.get_description(item_id, stock.variation_id)
          expected = build_ebay_title(
              str(text.get("name") or ""),
              str(text.get("description") or ""),
              str(text.get("technicalData") or ""),
          )
          actual = str(text.get("name2") or "").strip()
          if actual != expected:
              raise SystemExit(f"Read-back mismatch for ArtikelID {item_id}: {actual!r} != {expected!r}")
          print(f"VERIFIED ArtikelID {item_id}: {actual}")
          PY

      - name: Commit verified checkpoint
        shell: bash
        run: |
          if git diff --quiet -- state/last_processed.json; then
            echo "No checkpoint change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_processed.json
          git commit -m "chore: record verified plenty article checkpoint"
          git push
