name: One-time Shopify Name 1 + Name 2 dry run

on:
  push:
    paths:
      - ".github/workflows/test-name1.yml"

# Validation after preserving units in de-duplicated attributes.
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLENTY_BASE_URL: ${{ secrets.PLENTY_BASE_URL }}
      PLENTY_USERNAME: ${{ secrets.PLENTY_USERNAME }}
      PLENTY_PASSWORD: ${{ secrets.PLENTY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.ebay_title_automation --dry-run --max-items 20
